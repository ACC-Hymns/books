name: Package Hymnals
on:
  push:
    branches: [ main ]

# Required for the GH CLI to create releases and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip Hymnal Folders
        run: |
          for d in */; do
            dir=${d%/}
            if [[ "$dir" != .* && "$dir" != "node_modules" ]]; then
              echo "Zipping $dir..."
              zip -r "${dir}.zip" "$dir"
            fi
          done

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use 'latest' as the tag. 
          # --clobber overwrites existing files with the same name.
          # --notes allows the release to be created without a prompt.
          gh release delete latest --yes || true
          gh release create latest *.zip \
            --title "Latest Hymnal Packages" \
            --notes "Automated build from latest commit." \
            --target main