name: Package Hymnals
on:
  push:
    branches: [ main ]

# Required for the GH CLI to create releases, upload assets, and update repo variables
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip Hymnal Folders
        run: |
          for d in */; do
            dir=${d%/}
            if [[ "$dir" != .* && "$dir" != "node_modules" ]]; then
              echo "Zipping $dir..."
              zip -r "${dir}.zip" "$dir"
            fi
          done

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG_NUMBER="${{ vars.RELEASE_TAG_NUMBER }}"
          if [[ -z "$RELEASE_TAG_NUMBER" ]]; then
            RELEASE_TAG_NUMBER=1
          fi

          gh release create "$RELEASE_TAG_NUMBER" *.zip \
            --title "Hymnal Packages $RELEASE_TAG_NUMBER" \
            --notes "Automated build from commit ${{ github.sha }}." \
            --target main

          NEXT_TAG_NUMBER=$((RELEASE_TAG_NUMBER + 1))
          gh variable set RELEASE_TAG_NUMBER --body "$NEXT_TAG_NUMBER"
