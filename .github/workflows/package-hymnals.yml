name: Package Hymnals
on:
  push:
    branches: [ main ]

# GITHUB_TOKEN can create releases; updating repo variables requires a PAT (see Bump step).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip Hymnal Folders
        run: |
          for d in */; do
            dir=${d%/}
            if [[ "$dir" != .* && "$dir" != "node_modules" ]]; then
              echo "Zipping $dir..."
              zip -r "${dir}.zip" "$dir"
            fi
          done

      - name: Create Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG_NUMBER="${{ vars.RELEASE_TAG_NUMBER }}"
          if [[ -z "$RELEASE_TAG_NUMBER" ]]; then
            RELEASE_TAG_NUMBER=1
          fi

          gh release create "$RELEASE_TAG_NUMBER" *.zip \
            --title "Hymnal Packages $RELEASE_TAG_NUMBER" \
            --notes "Automated build from commit ${{ github.sha }}." \
            --target main

          echo "next_tag_number=$((RELEASE_TAG_NUMBER + 1))" >> "$GITHUB_OUTPUT"

      - name: Bump RELEASE_TAG_NUMBER
        env:
          GH_TOKEN: ${{ secrets.VARIABLES_TOKEN }}
        run: |
          gh variable set RELEASE_TAG_NUMBER --body "${{ steps.release.outputs.next_tag_number }}"
